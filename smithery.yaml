# Smithery MCP server manifest — https://smithery.ai
# BuyWhere: Agent-native product catalog API for AI agents
# v1.1.0 — P2.7 surface refresh (BUY-73963, 2026-08-24).
# Lead with deliver_to REQUIRED contract for v2, flag 370M catalog,
# OAuth 2.1, and no-email bearer key path.

name: buywhere
displayName: BuyWhere MCP Server
description: >
  Agent-native product catalog API for AI agents, ~370M deduplicated products
  across 28 countries. Every v2 search/best-price/deals call REQUIRES the
  end-user's ISO 3166-1 alpha-2 country code as `deliver_to` (e.g. SG, US, MY,
  TH, ID, VN, PH, GB, AU, IN), so results are ranked for products your user can
  actually receive, with per-row availability labels (in_stock / out_of_stock /
  preorder / discontinued / unshippable).

  Authentication: OAuth 2.1 (client_credentials) at
  https://api.buywhere.ai/v1/oauth/token, OR a no-email bearer key obtained in
  3 seconds via POST https://api.buywhere.ai/v1/auth/register with
  {"agent_name":"<your-agent>"}. No credit card, no signup form.

  Cover 7+ merchants — Shopee, Lazada, Amazon SG, Amazon US, Walmart, FairPrice,
  Carousell, Harvey Norman — across Singapore and the United States. Search
  products (search_products_v2), retrieve a known product (get_product_v2),
  compare 2–10 listings side-by-side (compare_products_v2), find the cheapest
  deliverable listing (find_best_price_v2), and surface discounted stock
  (get_deals_v2).

  Free tier: 1,000 calls/month. v1 deprecates 2026-10-01Z, retires 2026-12-31Z.

  📚 Agent-developer guide: https://api.buywhere.ai/docs/agent-dx
  📚 Engineering blog: https://buywhere.ai/blog

version: 1.1.0
license: MIT

mcp:
  transport: stdio
  authentication:
    type: bearer
    description: >
      API key required. Get a free key at https://buywhere.ai/api-keys.
      Free tier: 1,000 calls/month. No credit card required.

# v2 tool surface — every search/price/deals tool requires deliver_to on v2.
# v2 ships in the upcoming P2.7 release; until then these names document the
# contract and the live v1 surface (search_products, get_product, find_best_price,
# get_deals, compare_products, list_categories) remains callable. See
# https://api.buywhere.ai/docs/agent-dx for v1 ↔ v2 migration.
tools:
  - name: search_products_v2
    description: >
      Search the BuyWhere product catalog by keyword. v2 REQUIRES `deliver_to`
      (ISO 3166-1 alpha-2 country code) so results are ranked for the end user's
      market with per-row availability. Optional filters: category, min_price,
      max_price, source (merchant), include_unshippable, limit (1–50).

  - name: get_product_v2
    description: >
      Retrieve full details for a specific BuyWhere product by ID. v2 returns
      the same shape as v1 plus per-row `availability` for the current market
      (use `deliver_to` to scope availability).

  - name: compare_products_v2
    description: >
      Compare 2–10 products side-by-side across merchants. v2 lets callers
      scope the comparison to a market with `deliver_to`.

  - name: get_deals_v2
    description: >
      Find products with significant price drops, deliverability-filtered.
      v2 REQUIRES `deliver_to`. Optional: category, min_discount_pct,
      include_unshippable, limit.

  - name: find_best_price_v2
    description: >
      Find the cheapest deliverable listing for a product across covered
      merchants. v2 REQUIRES `deliver_to`. Optional: category,
      include_unshippable.

categories:
  - Commerce
  - Shopping
  - Price Comparison
  - Singapore
  - Southeast Asia

keywords:
  - shopping
  - ecommerce
  - price comparison
  - product search
  - singapore
  - southeast asia
  - shopee
  - lazada
  - amazon
  - ai agent
  - mcp
  - commerce api
  - deliver_to
  - availability

author:
  name: BuyWhere
  email: api@buywhere.ai
  url: https://buywhere.ai

homepage: https://buywhere.ai
documentation: https://api.buywhere.ai/docs/agent-dx
repository: https://github.com/BuyWhere/buywhere-mcp

startCommand:
  type: node
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: BuyWhere API Key
        description: Your BuyWhere API key. Get one free at https://buywhere.ai/api-keys
        x-sensitive: true
    required: [apiKey]
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@buywhere/mcp-server"],
      env: config.apiKey ? { BUYWHERE_API_KEY: config.apiKey } : {}
    })

supported_clients:
  - Claude Desktop
  - Cursor
  - VS Code Copilot
  - Custom MCP agents
  - LangChain
  - CrewAI
  - Mastra
  - AutoGen
  - Gemini

regions:
  - Singapore (SG)
  - United States (US)
  - Vietnam (VN)
  - Thailand (TH)
  - Malaysia (MY)

features:
  - deliver_to required on v2 search/best-price/deals (ISO 3166-1 alpha-2)
  - Per-row availability labels (in_stock, out_of_stock, preorder, discontinued, unshippable)
  - Cross-merchant price comparison across Shopee, Lazada, Amazon SG/US, Walmart, FairPrice, Carousell
  - Discount/deal discovery
  - Multi-currency support (SGD, USD, MYR, IDR, THB, PHP, VND)
  - Compact JSON mode for AI agents
  - Free tier available (1,000 calls/month)

# Sunset / deprecation notice (P2.7)
deprecation:
  notice: |
    The v1 tool names (search_products, find_best_price, get_deals) are entering
    a sunset window. v1 stays callable through 2026-12-31Z, then returns 410.
    Forward path is the v2 tool names above with deliver_to required.
  v1_deprecates_on: "2026-10-01T00:00:00Z"
  v1_retires_on:    "2026-12-31T00:00:00Z"
  migration_guide: "https://api.buywhere.ai/docs/agent-dx#migration-guide-v1-v2"

# 60-second quickstart (works against the live endpoint today, returns 200).
# v2 ships in P2.7 — until then, this v1 call still returns results. Migrating
# is a one-liner: drop the `_v2` suffix and add `deliver_to`.
quickstart: |
  curl -s -X POST https://api.buywhere.ai/mcp \
    -H "Authorization: Bearer $BUYWHERE_API_KEY" \
    -H "Content-Type: application/json" \
    -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_products","arguments":{"q":"wireless headphones","limit":5}}}'
